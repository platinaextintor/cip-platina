<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Testes do CIP</title>
    <style>
      body { margin: 0; background: #f6f7fa; color: #0e1729; font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; padding: 24px; }
      .caixa { max-width: 780px; margin: 0 auto; border: 1px solid #e4e8ef; border-radius: 12px; background: #fff; padding: 24px; }
      h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
      .placar { margin: 0 0 20px; font-size: 14px; }
      .verde { color: #0c7048; font-weight: 600; }
      .vermelho { color: #bf1f2c; font-weight: 600; }
      h2 { margin: 22px 0 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #737f95; font-weight: 600; }
      .caso { display: flex; gap: 10px; border-top: 1px solid #eef1f6; padding: 7px 0; font-size: 14px; }
      .caso:first-of-type { border-top: 0; }
      .marca { flex: none; width: 18px; }
      .porque { display: block; color: #bf1f2c; font-size: 13px; }
      #palco { position: absolute; left: -9999px; width: 1200px; }
    </style>
  </head>
  <body>
    <div class="caixa">
      <h1>Testes do CIP</h1>
      <p class="placar" id="placar">rodando…</p>
      <div id="saida"></div>
    </div>

    <!-- Palco onde as telas são desenhadas para conferência, fora da vista. -->
    <div id="palco">
      <header class="topbar"><span id="presenca" hidden></span><span id="estadoNuvem"></span><div id="progressChip"></div><button id="openData"></button><button id="sairBotao"></button></header>
      <main id="main"></main>
      <div class="drawer-scrim" id="scrim" hidden></div>
      <aside class="drawer" id="drawer" hidden></aside>
      <div class="portao" id="portao" hidden><form id="formEntrar"><input id="entrarEmail"><input id="entrarSenha"><p id="portaoErro" hidden></p><button id="botaoEntrar"></button><button id="esqueciSenha"></button><span id="carimboVersao"></span></form></div>
    </div>

    <!-- A versão sai do relógio: testar código velho por causa de cache já
         custou caro aqui. Esta página nunca deve ser servida do cache. -->
    <script>
      const V = "?t=" + Date.now();
      document.write(`<link rel="stylesheet" href="./styles.css${V}" />`);
      document.write(`<scr` + `ipt src="./dominio.js${V}"></scr` + `ipt>`);
      document.write(`<scr` + `ipt src="./bpmn.js${V}"></scr` + `ipt>`);
      /* nuvem.js entra aqui porque a tradução estado↔peças é lógica pura e
         precisava de teste: o fim nomeado ficou meses sem linha no banco. O
         arquivo não cria cliente no topo, então carregar não conecta nada. */
      document.write(`<scr` + `ipt src="./nuvem.js${V}"></scr` + `ipt>`);
    </script>

    <script>
      const saida = document.getElementById("saida");
      let passou = 0;
      let falhou = 0;

      function grupo(nome) {
        const h = document.createElement("h2");
        h.textContent = nome;
        saida.appendChild(h);
      }

      function teste(nome, fn) {
        let erro = null;
        try {
          const r = fn();
          /* Promise não é `false`, então um teste assíncrono passaria sempre —
             verde bonito que não verificou nada. Melhor recusar na cara. */
          if (r && typeof r.then === "function") erro = "teste assíncrono: esta bancada é síncrona";
          else if (r === false) erro = "devolveu falso";
        } catch (e) {
          erro = e.message;
        }
        erro ? falhou++ : passou++;
        const d = document.createElement("div");
        d.className = "caso";
        d.innerHTML = `<span class="marca ${erro ? "vermelho" : "verde"}">${erro ? "✕" : "✔"}</span>
          <span>${nome}${erro ? `<span class="porque">${erro}</span>` : ""}</span>`;
        saida.appendChild(d);
      }

      function igual(a, b, msg = "") {
        const x = JSON.stringify(a);
        const y = JSON.stringify(b);
        if (x !== y) throw new Error(`${msg} esperava ${y}, veio ${x}`);
      }

      /* Um processo mínimo, para os testes não repetirem 15 campos. */
      /* O molde nasce APROVÁVEL: dono, executor e porquê preenchidos. Assim um
         teste sobre outra coisa não precisa saber do critério de pronto, e um
         teste sobre incompletude sobrescreve o campo que quer vazio. */
      function proc(extra = {}) {
        return {
          id: "p1", nome: "Processo", setorId: "s-comercial",
          porque: "existe por isso", entrada: "algo chega", saida: "algo sai",
          donoCargoId: "c-supervisor", cargosIds: ["c-vendedor"], status: "rascunho",
          videoUrl: "", seErrar: "", anexos: [], passos: [], perguntas: [],
          proximos: [], ...extra,
        };
      }
      /* Na vida real nenhum processo chega ao desenhista sem passar por normalizar().
         Testar sem ele é testar um estado que o CIP nunca produz. */
      function procVivo(extra = {}) {
        state = normalizar({ ...semente(), processos: [proc({ passos: [passo()], ...extra })] });
        return state.processos[0];
      }
      function passo(extra = {}) {
        return {
          id: "ps1", tipo: "etapa", cargoId: "", oQue: "Fazer algo", comoFazer: "",
          porque: "", armadilha: "", imagem: "", videoUrl: "",
          seSim: "", seNao: "", sistemaIds: [], ...extra,
        };
      }

      // ============================================================ DOMÍNIO

      grupo("Domínio · estado");

      /* Verifica a forma, não a lista exata: o modelo cresce, e um teste que
         enumera chaves quebra a cada entidade nova sem apontar defeito algum. */
      teste("estadoVazio traz as entidades conhecidas, todas como lista vazia", () => {
        const v = estadoVazio();
        ["setores", "cargos", "processos", "decisoes", "fins", "documentos", "sistemas", "indicadores"]
          .forEach((k) => {
            if (!Array.isArray(v[k])) throw new Error(`${k} não é lista`);
            if (v[k].length) throw new Error(`${k} deveria nascer vazia`);
          });
        if (typeof v.empresa !== "object") throw new Error("empresa deveria ser objeto");
      });

      teste("semente traz o esqueleto e nenhum conteúdo", () => {
        const s = semente();
        igual([s.setores.length, s.cargos.length], [4, 5], "esqueleto:");
        igual([s.processos.length, s.decisoes.length, s.documentos.length], [0, 0, 0], "conteúdo:");
      });

      teste("normalizar repara base sem decisoes nem documentos", () => {
        const d = normalizar({ empresa: {}, setores: [], cargos: [], processos: [] });
        if (!Array.isArray(d.decisoes) || !Array.isArray(d.documentos)) throw new Error("não criou as listas");
      });

      teste("normalizar converte saída do formato antigo (id solto)", () => {
        const d = normalizar({
          empresa: {}, setores: [], cargos: [], decisoes: [],
          processos: [proc({ proximos: ["p2"] }), proc({ id: "p2" })],
        });
        igual(d.processos[0].proximos, [{ para: "p2", rotulo: "" }]);
      });

      teste("normalizar descarta ligação para peça que não existe", () => {
        const d = normalizar({
          empresa: {}, setores: [], cargos: [], decisoes: [],
          processos: [proc({ proximos: [{ para: "fantasma", rotulo: "" }] })],
        });
        igual(d.processos[0].proximos, []);
      });

      teste("dado antigo com fase é limpo, não carregado para sempre", () => {
        const d = normalizar({
          empresa: {}, setores: [], cargos: [], documentos: [], sistemas: [],
          fases: [{ id: "f1", nome: "Captar" }],
          processos: [{ id: "p1", nome: "x", faseId: "f1", setorId: "", cargosIds: [], passos: [], proximos: [] }],
        });
        if (d.fases) throw new Error("a fase voltou");
        if ("faseId" in d.processos[0]) throw new Error("o processo ainda carrega faseId");
      });

      /* A guarda que faltava, e que pegou um bug real: a estrutura gravada no
         banco continuava carregando `fases`. Escrever a chave de volta a cada
         gravação faria a fase ressuscitar do próprio banco. */
      teste("a estrutura gravada no banco não leva fase junto", () => {
        state = semente();
        const estrutura = pecasDoEstado(state).find((p) => p.tipo === "estrutura");
        if ("fases" in estrutura.dados) throw new Error("a fase foi para o banco");
      });

      grupo("Domínio · id é chave, não texto de estranho");

      /* Id normalmente nasce de uid(). Mas também vem de .bpmn e de JSON
         importado — e entra em atributo HTML em trinta lugares. Um id com aspas
         sai do atributo e vira código na tela de quem abrir, e dos outros dois
         pela sincronia ao vivo. */
      teste("id perigoso é trocado na entrada", () => {
        const mau = 'a" onmouseover="alert(1)';
        const d = normalizar({ empresa: {}, setores: [], cargos: [], documentos: [], sistemas: [],
          processos: [{ id: mau, nome: "x", setorId: "", cargosIds: [], passos: [], proximos: [] }] });
        if (d.processos[0].id === mau) throw new Error("o id perigoso passou");
        if (!/^[A-Za-z0-9_:.-]+$/.test(d.processos[0].id)) throw new Error("o substituto também é perigoso");
      });

      teste("trocar o id não quebra as ligações que apontavam para ele", () => {
        /* Sem `</scr`+`ipt>` literal: dentro de um .html isso encerra o bloco
           e o arquivo inteiro para de rodar. Aconteceu ao escrever este teste. */
        const mau = '<' + 'script>x</scr' + 'ipt>';
        const d = normalizar({ empresa: {}, setores: [], cargos: [], documentos: [], sistemas: [],
          processos: [
            { id: "a", nome: "A", setorId: "", cargosIds: [], passos: [], proximos: [{ para: mau, rotulo: "" }] },
            { id: mau, nome: "B", setorId: "", cargosIds: [], passos: [], proximos: [] },
          ] });
        const novoId = d.processos.find((p) => p.nome === "B").id;
        igual(d.processos[0].proximos.map((x) => x.para), [novoId], "a seta acompanhou:");
      });

      teste("id de passo também é saneado, e a ligação interna segue", () => {
        const mau = 'p"><img src=x onerror=alert(1)>';
        const d = normalizar({ empresa: {}, setores: [], cargos: [], documentos: [], sistemas: [],
          processos: [{ id: "P", nome: "x", setorId: "", cargosIds: [], proximos: [], passos: [
            { id: "s1", tipo: "etapa", oQue: "um", proximos: [{ para: mau, rotulo: "" }] },
            { id: mau, tipo: "etapa", oQue: "dois", proximos: [] },
          ] }] });
        const passos = d.processos[0].passos;
        if (passos.some((s) => s.id === mau)) throw new Error("o id perigoso do passo passou");
        igual(passos[0].proximos.map((x) => x.para), [passos[1].id]);
      });

      teste("id bom não é remexido — trocar id à toa quebraria referência de fora", () => {
        const d = normalizar({ empresa: {}, setores: [], cargos: [], documentos: [], sistemas: [],
          processos: [{ id: "Task_Proposta", nome: "x", setorId: "", cargosIds: [], passos: [], proximos: [] }] });
        igual(d.processos[0].id, "Task_Proposta");
      });

      teste("atributo com aspas simples é lido — XML aceita as duas", () => {
        const xml = `<?xml version="1.0"?><bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL">
          <bpmn:process id='P'><bpmn:subProcess id='T1' name='Com aspas simples' /></bpmn:process></bpmn:definitions>`;
        state = semente();
        igual(lerBpmn(xml).processos.map((p) => p.nome), ["Com aspas simples"]);
      });

      teste("id importado do BPMN passa pelo saneamento", () => {
        const xml = `<?xml version="1.0"?><bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL">
          <bpmn:process id="P"><bpmn:subProcess id='mau" onclick="alert(1)' name="Perigoso" /></bpmn:process></bpmn:definitions>`;
        const { estado } = estadoComBpmn(xml, semente());
        const p = estado.processos.find((x) => x.nome === "Perigoso");
        if (!p) throw new Error("o processo sumiu");
        if (/[<>"']/.test(p.id)) throw new Error("id perigoso sobreviveu ao import: " + p.id);
      });

      grupo("Domínio · a régua do que está pronto");

      teste("processo sem porquê não conta como pronto", () =>
        mapeado(proc({ passos: [passo(), passo({ id: "b" }), passo({ id: "c" })] })) === false);

      teste("processo com menos de três passos não conta", () =>
        mapeado(proc({ porque: "existe por isso", passos: [passo(), passo({ id: "b" })] })) === false);

      /* "Pronto" passou a exigir aprovação com nome. Antes bastava estar
         preenchido — que é a definição de pronto que ninguém assina. */
      teste("processo completo mas não aprovado ainda não conta como pronto", () =>
        mapeado(proc({ porque: "existe por isso", passos: [passo(), passo({ id: "b" }), passo({ id: "c" })] })) === false);

      teste("processo completo E aprovado conta como pronto", () => {
        const p = proc({ porque: "existe por isso", cargosIds: ["c-vendedor"], passos: [passo(), passo({ id: "b" }), passo({ id: "c" })] });
        aprovarProcesso(p, "Eric");
        return mapeado(p) === true;
      });


      teste("faltando aponta o que impede, com o vocabulário curto", () => {
        state = semente();
        const f = faltando(proc({ porque: "", passos: [], donoCargoId: "", cargosIds: [] }));
        ["por que existe", "os passos", "dono", "quem executa"].forEach((esperado) => {
          if (!f.includes(esperado)) throw new Error(`faltou "${esperado}" em ${JSON.stringify(f)}`);
        });
      });

      /* A régua de pronto tem que ser UMA. Se estas duas discordarem, alguém
         aprova e o contador não sobe — foi o que o ensaio geral pegou. */
      teste("aprovável e pronto são a mesma régua", () => {
        state = semente();
        const p = normalizar({ ...semente(), processos: [proc({ passos: [passo(), passo({ id: "b" })] })] }).processos[0];
        state.processos = [p];
        igual(faltaParaAprovar(p), [], "nada impede aprovar:");
        aprovarProcesso(p, "Eric");
        if (!mapeado(p)) throw new Error("aprovou e não conta como pronto");
      });

      grupo("Domínio · posição vem das ligações");

      teste("cadeia simples anda uma casa por ligação", () => {
        state = semente();
        state.processos = [
          proc({ id: "a", proximos: [{ para: "b", rotulo: "" }] }),
          proc({ id: "b", proximos: [{ para: "c", rotulo: "" }] }),
          proc({ id: "c" }),
        ];
        igual([colunas().a, colunas().b, colunas().c], [0, 1, 2]);
      });

      teste("retorno legítimo não empurra as colunas", () => {
        state = semente();
        state.processos = [
          proc({ id: "a", proximos: [{ para: "b", rotulo: "" }] }),
          proc({ id: "b", proximos: [{ para: "c", rotulo: "" }] }),
          proc({ id: "c", proximos: [{ para: "b", rotulo: "não aprovou" }] }),
        ];
        igual([colunas().a, colunas().b, colunas().c], [0, 1, 2]);
      });

      teste("ciclo fechado não trava nem estoura", () => {
        state = semente();
        state.processos = [
          proc({ id: "a", proximos: [{ para: "b", rotulo: "" }] }),
          proc({ id: "b", proximos: [{ para: "a", rotulo: "" }] }),
        ];
        const t = performance.now();
        const c = colunas();
        if (performance.now() - t > 500) throw new Error("demorou demais");
        if (Math.max(c.a, c.b) > 2) throw new Error("colunas dispararam: " + JSON.stringify(c));
      });

      teste("decisão entra na conta das colunas", () => {
        state = semente();
        state.processos = [proc({ id: "a", proximos: [{ para: "d1", rotulo: "" }] }), proc({ id: "b" })];
        state.decisoes = [{ id: "d1", pergunta: "Aprovado?", setorId: "s-comercial", proximos: [{ para: "b", rotulo: "sim" }] }];
        igual([colunas().a, colunas().d1, colunas().b], [0, 1, 2]);
      });

      grupo("Domínio · hierarquia");

      teste("descendeDe enxerga neto, não só filho", () => {
        state = semente();
        if (!descendeDe("c-vendedor", "c-diretor")) throw new Error("não viu o neto");
        if (descendeDe("c-diretor", "c-vendedor")) throw new Error("viu o que não existe");
      });

      teste("trilha do cargo deriva do vínculo, nunca é guardada", () => {
        state = semente();
        state.processos = [proc({ id: "a", cargosIds: ["c-vendedor"] }), proc({ id: "b", cargosIds: [] })];
        igual(processosDoCargo("c-vendedor").map((p) => p.id), ["a"]);
      });

      grupo("Domínio · links de fora");

      teste("linkSeguro barra javascript:", () => linkSeguro("javascript:alert(1)") === "");
      teste("linkSeguro deixa passar https", () => linkSeguro("https://a.com") === "https://a.com");
      teste("youtubeId entende watch, youtu.be e shorts", () => {
        igual([
          youtubeId("https://www.youtube.com/watch?v=abcdefghijk"),
          youtubeId("https://youtu.be/abcdefghijk"),
          youtubeId("https://www.youtube.com/shorts/abcdefghijk"),
        ], ["abcdefghijk", "abcdefghijk", "abcdefghijk"]);
      });
      teste("esc neutraliza HTML", () => esc('<img src=x onerror="a">').indexOf("<") === -1);

      grupo("Domínio · sincronia vinda de fora");

      teste("alteração remota substitui no lugar, não no fim", () => {
        state = semente();
        state.processos = [proc({ id: "a", nome: "A" }), proc({ id: "b", nome: "B" }), proc({ id: "c", nome: "C" })];
        aplicarNoEstado({ peca: "p:b", acao: "UPDATE", dados: proc({ id: "b", nome: "B EDITADO" }) });
        igual(state.processos.map((p) => p.nome), ["A", "B EDITADO", "C"]);
      });

      teste("remoção remota tira a peça certa", () => {
        state = semente();
        state.processos = [proc({ id: "a", nome: "A" }), proc({ id: "b", nome: "B" })];
        aplicarNoEstado({ peca: "p:a", acao: "DELETE" });
        igual(state.processos.map((p) => p.nome), ["B"]);
      });

      teste("evento sem peça não derruba nada", () => {
        state = semente();
        aplicarNoEstado({ acao: "DELETE" });
        aplicarNoEstado(null);
        return true;
      });

      grupo("Domínio · camadas da arquitetura");

      teste("semente já classifica os setores nas três camadas", () => {
        state = semente();
        igual(state.setores.map((s) => s.camada), ["estrategico", "principal", "principal", "apoio"]);
      });

      teste("setor sem camada vira principal", () => {
        const d = normalizar({ empresa: {}, cargos: [], decisoes: [], processos: [],
          setores: [{ id: "x", nome: "Novo" }, { id: "y", nome: "Errado", camada: "inventada" }] });
        igual(d.setores.map((s) => s.camada), ["principal", "principal"]);
      });

      teste("processo herda a camada do setor, não guarda a sua", () => {
        state = semente();
        const p = proc({ setorId: "s-admin" });
        if (camadaDoProcesso(p) !== "apoio") throw new Error("veio " + camadaDoProcesso(p));
        if ("camada" in p) throw new Error("o processo não deveria guardar camada");
      });

      teste("setores saem na ordem estratégico, principal, apoio", () => {
        state = semente();
        igual(setoresPorCamada().map((s) => s.nome), ["Gestão", "Comercial", "Técnica", "Administrativo"]);
      });

      grupo("Domínio · onde a cadeia arrebenta");

      teste("quem entrega sem dizer o que entrega é apontado", () => {
        state = semente();
        state.processos = [
          proc({ id: "a", nome: "Orçamento", saida: "", proximos: [{ para: "b", rotulo: "" }] }),
          proc({ id: "b", nome: "Análise", entrada: "proposta aprovada" }),
        ];
        const f = elosFracos();
        igual(f.map((x) => [x.nome, x.falta]), [["Orçamento", "saída"]]);
      });

      teste("quem recebe sem dizer o que recebe é apontado", () => {
        state = semente();
        state.processos = [
          proc({ id: "a", nome: "Orçamento", saida: "proposta aprovada", proximos: [{ para: "b", rotulo: "" }] }),
          proc({ id: "b", nome: "Análise", entrada: "" }),
        ];
        igual(elosFracos().map((x) => [x.nome, x.falta]), [["Análise", "entrada"]]);
      });

      teste("cadeia declarada nos dois lados não acusa nada", () => {
        state = semente();
        state.processos = [
          proc({ id: "a", saida: "proposta aprovada", proximos: [{ para: "b", rotulo: "" }] }),
          proc({ id: "b", entrada: "proposta aprovada", saida: "pedido criado" }),
        ];
        igual(elosFracos(), []);
      });

      teste("processo solto não é cobrado de entrada nem saída", () => {
        state = semente();
        state.processos = [proc({ id: "sozinho" })];
        igual(elosFracos(), []);
      });

      teste("entrada vinda de uma decisão também conta", () => {
        state = semente();
        state.processos = [proc({ id: "b", nome: "Análise", entrada: "" })];
        state.decisoes = [{ id: "d1", pergunta: "Aprovado?", setorId: "s-comercial",
          proximos: [{ para: "b", rotulo: "sim" }] }];
        igual(elosFracos().map((x) => x.falta), ["entrada"]);
      });

      grupo("Domínio · o processo aponta para a biblioteca");

      teste("anexo digitado à mão vira documento de verdade", () => {
        state = normalizar({ ...semente(), documentos: [], processos: [
          proc({ id: "P", anexos: [{ id: "a1", titulo: "Tabela de preço", url: "https://exemplo/tabela" }] }),
        ] });
        igual(state.documentos.map((d) => [d.titulo, d.url]), [["Tabela de preço", "https://exemplo/tabela"]]);
        igual(documentosDoProcesso(state.processos[0]).length, 1);
        if ("anexos" in state.processos[0]) throw new Error("o anexo antigo ficou para trás");
      });

      teste("o mesmo material em dois processos vira UM documento", () => {
        state = normalizar({ ...semente(), documentos: [], processos: [
          proc({ id: "a", anexos: [{ id: "x", titulo: "NBR", url: "https://n" }] }),
          proc({ id: "b", anexos: [{ id: "y", titulo: "NBR", url: "https://n" }] }),
        ] });
        igual(state.documentos.length, 1);
        igual(state.processos.map((p) => p.documentoIds.length), [1, 1]);
      });

<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL">

    <bpmn:startEvent id="S1" name="Chegou" />
    <bpmn:subProcess id="T1" name="Fazer proposta" />
    <bpmn:exclusiveGateway id="G1" name="Aprovou?" />
    <bpmn:subProcess id="T2" name="Emitir NF" />
    <bpmn:endEvent id="E1" name="Recusado" />
    <bpmn:sequenceFlow id="F1" sourceRef="S1" targetRef="T1" />
    <bpmn:sequenceFlow id="F2" sourceRef="T1" targetRef="G1" />
    <bpmn:sequenceFlow id="F3" name="Sim" sourceRef="G1" targetRef="T2" />
    <bpmn:sequenceFlow id="F4" name="Não" sourceRef="G1" targetRef="E1" />
  </bpmn:process>
</bpmn:definitions>`;

          sistemas: [{ id: "sis1", nome: "CAD", critico: true, descricao: "", url: "" }],
          processos: [proc({ id: "P", passos: [passo({ id: "1", sistemaIds: ["sis1"] })] })] });
        state.sistemas = [];
        state = normalizar(state);
        igual(state.processos[0].passos[0].sistemaIds, []);
      });

      teste("apagar tudo devolve um estado que as telas conseguem desenhar", () => {
        /* O bug que quebrou três telas: apagar deixava o estado sem listas que
           o resto do código esperava encontrar. */
        state = normalizar({ ...estadoVazio(), empresa: { nome: "Platina" } });
        const listas = Object.keys(estadoVazio()).filter((k) => Array.isArray(estadoVazio()[k]));
        const faltando = listas.filter((k) => !Array.isArray(state[k]));
        igual(faltando, [], "listas ausentes depois de zerar:");
        igual(pendencias().length, 0, "nada pendente num sistema vazio:");
        igual(retratoDoBloco1().processos, 0);
        if (bpmnDoMapa() === null) throw new Error("o mapa vazio não desenha");
      });

      teste("o macro vazio ainda desenha as raias, sem quebrar", () => {
        state = normalizar({ ...semente(), processos: [] });
        const html = bpmnDesenhar(bpmnDoMapa());
        if (/NaN|undefined/.test(html)) throw new Error("desenho quebrado com mapa vazio");
        if (!html.includes("bpmn-faixa")) throw new Error("as raias sumiram");
      });

      grupo("Nuvem · estado vira peças e volta inteiro");

      function estadoCheio() {
        return normalizar({
          ...semente(),
          processos: [proc({ id: "p1", proximos: [{ para: "d1", rotulo: "" }] })],
          decisoes: [{ id: "d1", tipo: "inclusivo", pergunta: "Modalidade?", setorId: "s-comercial", proximos: [{ para: "f1", rotulo: "Contrato" }] }],
          fins: [{ id: "f1", nome: "Proposta não aprovada", setorId: "s-comercial", proximos: [] }],
          documentos: [{ id: "doc1", titulo: "POP", categoria: "pop", escopo: "", resumo: "", url: "", videoUrl: "" }],
          sistemas: [{ id: "sis1", nome: "CAD", descricao: "", url: "", critico: true }],
          indicadores: [{ id: "i1", nome: "Prazo médio", pergunta: "?", unidade: "dias", direcao: "menor", meta: 2, frequencia: "mensal", processoIds: ["p1"] }],
        });
      }

      /* A guarda que faltava: se alguém acrescentar uma lista ao modelo e
         esquecer de dar linha para ela no banco, este teste cai. Foi
         exatamente o que aconteceu com `fins`. */
      teste("toda lista do modelo tem lugar no banco", () => {
        const st = estadoCheio();
        const volta = estadoDePecas(pecasDoEstado(st).map((p) => ({ tipo: p.tipo, dados: p.dados })));
        const listas = Object.keys(estadoVazio()).filter((k) => Array.isArray(estadoVazio()[k]));
        const perdidas = listas.filter((k) => (st[k] || []).length !== (volta[k] || []).length);
        igual(perdidas, [], "listas que não voltaram do banco:");
      });

      teste("o fim nomeado sobrevive à ida e volta", () => {
        const st = estadoCheio();
        const volta = estadoDePecas(pecasDoEstado(st).map((p) => ({ tipo: p.tipo, dados: p.dados })));
        igual(volta.fins.map((f) => f.nome), ["Proposta não aprovada"]);
      });

      teste("cada peça tem id único — senão uma sobrescreve a outra", () => {
        const ids = pecasDoEstado(estadoCheio()).map((p) => p.id);
        igual(ids.length, new Set(ids).size, "ids repetidos:");
      });

      teste("as ligações voltam inteiras, não só as peças", () => {
        const st = estadoCheio();
        const volta = estadoDePecas(pecasDoEstado(st).map((p) => ({ tipo: p.tipo, dados: p.dados })));
        igual(volta.decisoes[0].proximos.map((x) => [x.para, x.rotulo]), [["f1", "Contrato"]]);
      });

      teste("o que este cliente sabe escrever bate com o que ele escreve", () => {
        const emitidos = [...new Set(pecasDoEstado(estadoCheio()).map((p) => p.tipo))].sort();
        const naoDeclarados = emitidos.filter((t) => !TIPOS_QUE_SEI_ESCREVER.has(t));
        igual(naoDeclarados, [], "tipos que ele escreve mas não declara:");
      });

      teste("tipo que este cliente não conhece não entra na lista de apagar", () => {
        /* A trava contra o pior caso: aba velha lê peça nova, não entende, e
           conclui que ela sumiu. Apagar aí é destruir trabalho alheio. */
        /* Um tipo que ainda não existe — o cliente do futuro é que vai escrever. */
        if (TIPOS_QUE_SEI_ESCREVER.has("risco")) throw new Error("mude o tipo do teste");
        const sombraFalsa = new Map([
          ["risco:1", { tipo: "risco" }],
          ["p:sumido", { tipo: "processo" }],
        ]);
        const idsAtuais = new Set();
        const sumidas = [...sombraFalsa.entries()]
          .filter(([id, peca]) => !idsAtuais.has(id) && TIPOS_QUE_SEI_ESCREVER.has(peca.tipo))
          .map(([id]) => id);
        igual(sumidas, ["p:sumido"]);
      });

      /* O bug que o Eric encontrou clicando: na tela de leitura o desenho saía
         sem `interativo`, e sem isso o bpmn.js não põe `data-bpmn-el` nas peças.
         Desenho bonito e morto — clicar num processo não fazia nada porque não
         havia alvo para o clique pegar. */
      teste("peça só é clicável se o desenho sair com alvo", () => {
        state = normalizar({ ...semente(), processos: [proc({ id: "P", nome: "Clicável" })] });
        const modelo = bpmnDoMapa();
        const morto = bpmnDesenhar(modelo, { zoom: 1 });
        const vivo = bpmnDesenhar(modelo, { interativo: true, zoom: 1 });
        if (morto.includes("data-bpmn-el")) throw new Error("sem interativo não deveria ter alvo");
        if (!vivo.includes('data-bpmn-el="P"')) throw new Error("com interativo o alvo sumiu");
      });

      grupo("Tela · medir a coisa certa");

      /* A legenda mora dentro da mesma tela do desenho e também tem <svg>.
         Sem a classe, "Ajustar" mediu um ícone de 24px e o zoom foi para o
         teto — bug real, achado só porque eu olhei a tela depois de importar. */
      teste("o desenho é achável sem pegar o ícone da legenda", () => {
        const caixa = document.createElement("div");
        caixa.id = "telaDeMentira";
        caixa.innerHTML = `<details><summary>legenda</summary><svg viewBox="0 0 24 24" width="14"></svg></details>
          ${bpmnDesenhar(bpmnDoProcesso(procVivo({ passos: [passo({ id: "1" }), passo({ id: "2" })] })))}`;
        document.body.appendChild(caixa);
        const achado = caixa.querySelector("svg.bpmn");
        const largura = Number(achado.getAttribute("viewBox").split(" ")[2]);
        caixa.remove();
        if (largura <= 24) throw new Error("pegou o ícone da legenda, não o desenho");
      });

      grupo("Tela · o que o CSS pode esconder");

      teste("atributo hidden vence qualquer classe com display", () => {
        const d = document.createElement("div");
        d.className = "portao";
        d.hidden = true;
        document.getElementById("palco").appendChild(d);
        const visivel = getComputedStyle(d).display !== "none";
        d.remove();
        if (visivel) throw new Error("elemento continua na tela mesmo com hidden — foi este o bug do login");
      });

      teste("as classes que se escondem obedecem", () => {
        const quebradas = [];
        ["portao", "aviso-remoto", "drawer", "drawer-scrim", "presenca"].forEach((c) => {
          const d = document.createElement("div");
          d.className = c;
          d.hidden = true;
          document.getElementById("palco").appendChild(d);
          if (getComputedStyle(d).display !== "none") quebradas.push(c);
          d.remove();
        });
        if (quebradas.length) throw new Error("continuam visíveis: " + quebradas.join(", "));
      });

      // ============================================================ placar

      const placar = document.getElementById("placar");
      placar.innerHTML = falhou
        ? `<span class="vermelho">${falhou} falhou${falhou > 1 ? "ram" : ""}</span> · ${passou} passou${passou > 1 ? "ram" : ""}`
        : `<span class="verde">${passou} testes, todos passaram</span>`;
      document.title = `${falhou ? "✕" : "✔"} Testes do CIP`;
    </script>
