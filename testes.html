<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Testes do CIP</title>
    <style>
      body { margin: 0; background: #f6f7fa; color: #0e1729; font: 15px/1.6 ui-sans-serif, system-ui, sans-serif; padding: 24px; }
      .caixa { max-width: 780px; margin: 0 auto; border: 1px solid #e4e8ef; border-radius: 12px; background: #fff; padding: 24px; }
      h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
      .placar { margin: 0 0 20px; font-size: 14px; }
      .verde { color: #0c7048; font-weight: 600; }
      .vermelho { color: #bf1f2c; font-weight: 600; }
      h2 { margin: 22px 0 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: #737f95; font-weight: 600; }
      .caso { display: flex; gap: 10px; border-top: 1px solid #eef1f6; padding: 7px 0; font-size: 14px; }
      .caso:first-of-type { border-top: 0; }
      .marca { flex: none; width: 18px; }
      .porque { display: block; color: #bf1f2c; font-size: 13px; }
      #palco { position: absolute; left: -9999px; width: 1200px; }
    </style>
  </head>
  <body>
    <div class="caixa">
      <h1>Testes do CIP</h1>
      <p class="placar" id="placar">rodando…</p>
      <div id="saida"></div>
    </div>

    <!-- Palco onde as telas são desenhadas para conferência, fora da vista. -->
    <div id="palco">
      <header class="topbar"><span id="presenca" hidden></span><span id="estadoNuvem"></span><div id="progressChip"></div><button id="openData"></button><button id="sairBotao"></button></header>
      <main id="main"></main>
      <div class="drawer-scrim" id="scrim" hidden></div>
      <aside class="drawer" id="drawer" hidden></aside>
      <div class="portao" id="portao" hidden><form id="formEntrar"><input id="entrarEmail"><input id="entrarSenha"><p id="portaoErro" hidden></p><button id="botaoEntrar"></button><button id="esqueciSenha"></button><span id="carimboVersao"></span></form></div>
    </div>

    <!-- A versão sai do relógio: testar código velho por causa de cache já
         custou caro aqui. Esta página nunca deve ser servida do cache. -->
    <script>
      const V = "?t=" + Date.now();
      document.write(`<link rel="stylesheet" href="./styles.css${V}" />`);
      document.write(`<scr` + `ipt src="./dominio.js${V}"></scr` + `ipt>`);
      document.write(`<scr` + `ipt src="./bpmn.js${V}"></scr` + `ipt>`);
    </script>

    <script>
      const saida = document.getElementById("saida");
      let passou = 0;
      let falhou = 0;

      function grupo(nome) {
        const h = document.createElement("h2");
        h.textContent = nome;
        saida.appendChild(h);
      }

      function teste(nome, fn) {
        let erro = null;
        try {
          const r = fn();
          if (r === false) erro = "devolveu falso";
        } catch (e) {
          erro = e.message;
        }
        erro ? falhou++ : passou++;
        const d = document.createElement("div");
        d.className = "caso";
        d.innerHTML = `<span class="marca ${erro ? "vermelho" : "verde"}">${erro ? "✕" : "✔"}</span>
          <span>${nome}${erro ? `<span class="porque">${erro}</span>` : ""}</span>`;
        saida.appendChild(d);
      }

      function igual(a, b, msg = "") {
        const x = JSON.stringify(a);
        const y = JSON.stringify(b);
        if (x !== y) throw new Error(`${msg} esperava ${y}, veio ${x}`);
      }

      /* Um processo mínimo, para os testes não repetirem 15 campos. */
      function proc(extra = {}) {
        return {
          id: "p1", nome: "Processo", setorId: "s-comercial", faseId: "f-orcar",
          donoCargoId: "c-supervisor", cargosIds: [], status: "rascunho", revisado: true,
          videoUrl: "", porque: "", seErrar: "", anexos: [], passos: [], perguntas: [],
          proximos: [], ...extra,
        };
      }
      function passo(extra = {}) {
        return {
          id: "ps1", tipo: "etapa", cargoId: "", oQue: "Fazer algo", comoFazer: "",
          porque: "", armadilha: "", regra: "", imagem: "", videoUrl: "",
          seSim: "", seNao: "", sistemaIds: [], ...extra,
        };
      }

      // ============================================================ DOMÍNIO

      grupo("Domínio · estado");

      /* Verifica a forma, não a lista exata: o modelo cresce, e um teste que
         enumera chaves quebra a cada entidade nova sem apontar defeito algum. */
      teste("estadoVazio traz as entidades conhecidas, todas como lista vazia", () => {
        const v = estadoVazio();
        ["setores", "cargos", "fases", "processos", "decisoes", "fins", "documentos", "sistemas"]
          .forEach((k) => {
            if (!Array.isArray(v[k])) throw new Error(`${k} não é lista`);
            if (v[k].length) throw new Error(`${k} deveria nascer vazia`);
          });
        if (typeof v.empresa !== "object") throw new Error("empresa deveria ser objeto");
      });

      teste("semente traz o esqueleto e nenhum conteúdo", () => {
        const s = semente();
        igual([s.setores.length, s.cargos.length, s.fases.length], [4, 5, 6], "esqueleto:");
        igual([s.processos.length, s.decisoes.length, s.documentos.length], [0, 0, 0], "conteúdo:");
      });

      teste("normalizar repara base sem decisoes nem documentos", () => {
        const d = normalizar({ empresa: {}, setores: [], cargos: [], fases: [], processos: [] });
        if (!Array.isArray(d.decisoes) || !Array.isArray(d.documentos)) throw new Error("não criou as listas");
      });

      teste("normalizar converte saída do formato antigo (id solto)", () => {
        const d = normalizar({
          empresa: {}, setores: [], cargos: [], fases: [], decisoes: [],
          processos: [proc({ proximos: ["p2"] }), proc({ id: "p2" })],
        });
        igual(d.processos[0].proximos, [{ para: "p2", rotulo: "" }]);
      });

      teste("normalizar descarta ligação para peça que não existe", () => {
        const d = normalizar({
          empresa: {}, setores: [], cargos: [], fases: [], decisoes: [],
          processos: [proc({ proximos: [{ para: "fantasma", rotulo: "" }] })],
        });
        igual(d.processos[0].proximos, []);
      });

      grupo("Domínio · a régua do que está pronto");

      teste("processo sem porquê não conta como pronto", () =>
        mapeado(proc({ passos: [passo(), passo({ id: "b" }), passo({ id: "c" })] })) === false);

      teste("processo com menos de três passos não conta", () =>
        mapeado(proc({ porque: "existe por isso", passos: [passo(), passo({ id: "b" })] })) === false);

      teste("processo completo conta como pronto", () =>
        mapeado(proc({ porque: "existe por isso", passos: [passo(), passo({ id: "b" }), passo({ id: "c" })] })) === true);

      teste("rascunho de IA não conta como pronto até ser revisado", () =>
        mapeado(proc({ porque: "x", revisado: false, passos: [passo(), passo({ id: "b" }), passo({ id: "c" })] })) === false);

      teste("faltando aponta o que impede", () => {
        const f = faltando(proc());
        if (!f.includes("por que existe") || !f.includes("os passos")) throw new Error("veio " + JSON.stringify(f));
      });

      grupo("Domínio · posição vem das ligações");

      teste("cadeia simples anda uma casa por ligação", () => {
        state = semente();
        state.processos = [
          proc({ id: "a", proximos: [{ para: "b", rotulo: "" }] }),
          proc({ id: "b", proximos: [{ para: "c", rotulo: "" }] }),
          proc({ id: "c" }),
        ];
        igual([colunas().a, colunas().b, colunas().c], [0, 1, 2]);
      });

      teste("retorno legítimo não empurra as colunas", () => {
        state = semente();
        state.processos = [
          proc({ id: "a", proximos: [{ para: "b", rotulo: "" }] }),
          proc({ id: "b", proximos: [{ para: "c", rotulo: "" }] }),
          proc({ id: "c", proximos: [{ para: "b", rotulo: "não aprovou" }] }),
        ];
        igual([colunas().a, colunas().b, colunas().c], [0, 1, 2]);
      });

      teste("ciclo fechado não trava nem estoura", () => {
        state = semente();
        state.processos = [
          proc({ id: "a", proximos: [{ para: "b", rotulo: "" }] }),
          proc({ id: "b", proximos: [{ para: "a", rotulo: "" }] }),
        ];
        const t = performance.now();
        const c = colunas();
        if (performance.now() - t > 500) throw new Error("demorou demais");
        if (Math.max(c.a, c.b) > 2) throw new Error("colunas dispararam: " + JSON.stringify(c));
      });

      teste("decisão entra na conta das colunas", () => {
        state = semente();
        state.processos = [proc({ id: "a", proximos: [{ para: "d1", rotulo: "" }] }), proc({ id: "b" })];
        state.decisoes = [{ id: "d1", pergunta: "Aprovado?", setorId: "s-comercial", faseId: "f-orcar", proximos: [{ para: "b", rotulo: "sim" }] }];
        igual([colunas().a, colunas().d1, colunas().b], [0, 1, 2]);
      });

      grupo("Domínio · hierarquia");

      teste("descendeDe enxerga neto, não só filho", () => {
        state = semente();
        if (!descendeDe("c-vendedor", "c-diretor")) throw new Error("não viu o neto");
        if (descendeDe("c-diretor", "c-vendedor")) throw new Error("viu o que não existe");
      });

      teste("trilha do cargo deriva do vínculo, nunca é guardada", () => {
        state = semente();
        state.processos = [proc({ id: "a", cargosIds: ["c-vendedor"] }), proc({ id: "b", cargosIds: [] })];
        igual(processosDoCargo("c-vendedor").map((p) => p.id), ["a"]);
      });

      grupo("Domínio · links de fora");

      teste("linkSeguro barra javascript:", () => linkSeguro("javascript:alert(1)") === "");
      teste("linkSeguro deixa passar https", () => linkSeguro("https://a.com") === "https://a.com");
      teste("youtubeId entende watch, youtu.be e shorts", () => {
        igual([
          youtubeId("https://www.youtube.com/watch?v=abcdefghijk"),
          youtubeId("https://youtu.be/abcdefghijk"),
          youtubeId("https://www.youtube.com/shorts/abcdefghijk"),
        ], ["abcdefghijk", "abcdefghijk", "abcdefghijk"]);
      });
      teste("esc neutraliza HTML", () => esc('<img src=x onerror="a">').indexOf("<") === -1);

      grupo("Domínio · sincronia vinda de fora");

      teste("alteração remota substitui no lugar, não no fim", () => {
        state = semente();
        state.processos = [proc({ id: "a", nome: "A" }), proc({ id: "b", nome: "B" }), proc({ id: "c", nome: "C" })];
        aplicarNoEstado({ peca: "p:b", acao: "UPDATE", dados: proc({ id: "b", nome: "B EDITADO" }) });
        igual(state.processos.map((p) => p.nome), ["A", "B EDITADO", "C"]);
      });

      teste("remoção remota tira a peça certa", () => {
        state = semente();
        state.processos = [proc({ id: "a", nome: "A" }), proc({ id: "b", nome: "B" })];
        aplicarNoEstado({ peca: "p:a", acao: "DELETE" });
        igual(state.processos.map((p) => p.nome), ["B"]);
      });

      teste("evento sem peça não derruba nada", () => {
        state = semente();
        aplicarNoEstado({ acao: "DELETE" });
        aplicarNoEstado(null);
        return true;
      });

      grupo("Domínio · camadas da arquitetura");

      teste("semente já classifica os setores nas três camadas", () => {
        state = semente();
        igual(state.setores.map((s) => s.camada), ["estrategico", "principal", "principal", "apoio"]);
      });

      teste("setor sem camada vira principal", () => {
        const d = normalizar({ empresa: {}, cargos: [], fases: [], decisoes: [], processos: [],
          setores: [{ id: "x", nome: "Novo" }, { id: "y", nome: "Errado", camada: "inventada" }] });
        igual(d.setores.map((s) => s.camada), ["principal", "principal"]);
      });

      teste("processo herda a camada do setor, não guarda a sua", () => {
        state = semente();
        const p = proc({ setorId: "s-admin" });
        if (camadaDoProcesso(p) !== "apoio") throw new Error("veio " + camadaDoProcesso(p));
        if ("camada" in p) throw new Error("o processo não deveria guardar camada");
      });

      teste("setores saem na ordem estratégico, principal, apoio", () => {
        state = semente();
        igual(setoresPorCamada().map((s) => s.nome), ["Gestão", "Comercial", "Técnica", "Administrativo"]);
      });

      grupo("Domínio · onde a cadeia arrebenta");

      teste("quem entrega sem dizer o que entrega é apontado", () => {
        state = semente();
        state.processos = [
          proc({ id: "a", nome: "Orçamento", saida: "", proximos: [{ para: "b", rotulo: "" }] }),
          proc({ id: "b", nome: "Análise", entrada: "proposta aprovada" }),
        ];
        const f = elosFracos();
        igual(f.map((x) => [x.nome, x.falta]), [["Orçamento", "saída"]]);
      });

      teste("quem recebe sem dizer o que recebe é apontado", () => {
        state = semente();
        state.processos = [
          proc({ id: "a", nome: "Orçamento", saida: "proposta aprovada", proximos: [{ para: "b", rotulo: "" }] }),
          proc({ id: "b", nome: "Análise", entrada: "" }),
        ];
        igual(elosFracos().map((x) => [x.nome, x.falta]), [["Análise", "entrada"]]);
      });

      teste("cadeia declarada nos dois lados não acusa nada", () => {
        state = semente();
        state.processos = [
          proc({ id: "a", saida: "proposta aprovada", proximos: [{ para: "b", rotulo: "" }] }),
          proc({ id: "b", entrada: "proposta aprovada", saida: "pedido criado" }),
        ];
        igual(elosFracos(), []);
      });

      teste("processo solto não é cobrado de entrada nem saída", () => {
        state = semente();
        state.processos = [proc({ id: "sozinho" })];
        igual(elosFracos(), []);
      });

      teste("entrada vinda de uma decisão também conta", () => {
        state = semente();
        state.processos = [proc({ id: "b", nome: "Análise", entrada: "" })];
        state.decisoes = [{ id: "d1", pergunta: "Aprovado?", setorId: "s-comercial", faseId: "f-orcar",
          proximos: [{ para: "b", rotulo: "sim" }] }];
        igual(elosFracos().map((x) => x.falta), ["entrada"]);
      });

      grupo("Domínio · sistema como objeto");

      teste("estadoVazio passa a ter a lista de sistemas", () => {
        if (!Array.isArray(estadoVazio().sistemas)) throw new Error("sem lista de sistemas");
      });

      teste("os sistemas do processo vêm dos passos, não são guardados nele", () => {
        state = semente();
        state.sistemas = [{ id: "cad", nome: "CAD", descricao: "", url: "", critico: true }];
        const p = proc({ passos: [passo({ id: "1", sistemaIds: ["cad"] }), passo({ id: "2" })] });
        igual(sistemasDoProcesso(p).map((s) => s.nome), ["CAD"]);
        if ("sistemaIds" in p) throw new Error("o processo não deveria guardar sistemas");
      });

      teste("o mesmo sistema em dois passos aparece uma vez só", () => {
        state = semente();
        state.sistemas = [{ id: "cad", nome: "CAD", descricao: "", url: "", critico: false }];
        const p = proc({ passos: [passo({ id: "1", sistemaIds: ["cad"] }), passo({ id: "2", sistemaIds: ["cad"] })] });
        igual(sistemasDoProcesso(p).length, 1);
      });

      teste("a pergunta inversa: o que para se o CAD cair", () => {
        state = semente();
        state.sistemas = [{ id: "cad", nome: "CAD", descricao: "", url: "", critico: true }];
        state.processos = [
          proc({ id: "a", nome: "Orçamento", passos: [passo({ id: "1", oQue: "Lançar pedido", sistemaIds: ["cad"] })] }),
          proc({ id: "b", nome: "Inspeção", passos: [passo({ id: "2" })] }),
          proc({ id: "c", nome: "Entrega", passos: [passo({ id: "3", sistemaIds: ["cad"] }), passo({ id: "4", sistemaIds: ["cad"] })] }),
        ];
        const onde = ondeApareceOSistema("cad");
        igual(onde.map((x) => [x.processo.nome, x.passos.length]), [["Orçamento", 1], ["Entrega", 2]]);
      });

      teste("apagar o sistema limpa a referência nos passos", () => {
        const d = normalizar({
          empresa: {}, setores: [], cargos: [], fases: [], decisoes: [], documentos: [], sistemas: [],
          processos: [proc({ passos: [passo({ sistemaIds: ["sumiu"] })] })],
        });
        igual(d.processos[0].passos[0].sistemaIds, []);
      });

      teste("sistema crítico sem nenhum passo é apontado", () => {
        state = semente();
        state.sistemas = [
          { id: "cad", nome: "CAD", descricao: "", url: "", critico: true },
          { id: "zap", nome: "WhatsApp", descricao: "", url: "", critico: false },
        ];
        state.processos = [proc({ passos: [passo({ sistemaIds: ["zap"] })] })];
        igual(sistemasOrfaos().map((s) => s.nome), ["CAD"]);
      });

      // ============================================================ BPMN

      grupo("BPMN · tradução do modelo");

      teste("processo vira início, tarefas e fim", () => {
        state = semente();
        const p = proc({ passos: [passo({ id: "1" }), passo({ id: "2" })] });
        const m = bpmnDoProcesso(p);
        igual(m.elementos.map((e) => e.tipo), ["inicio", "tarefa", "tarefa", "fim"]);
      });

      teste("decisão vira gateway com os dois caminhos", () => {
        state = semente();
        const p = proc({ passos: [passo({ id: "1", tipo: "decisao", seSim: "segue", seNao: "para" })] });
        const m = bpmnDoProcesso(p);
        if (!m.elementos.some((e) => e.tipo === "gateway")) throw new Error("sem gateway");
        igual(m.fluxos.filter((f) => f.rotulo).map((f) => f.rotulo).sort(), ["Não", "Sim"]);
      });

      teste("evidência ganha objeto de dados", () => {
        state = semente();
        const m = bpmnDoProcesso(proc({ passos: [passo({ tipo: "evidencia" })] }));
        if (!m.elementos.some((e) => e.dado)) throw new Error("sem objeto de dados");
      });

      teste("quem faz o passo define a raia", () => {
        state = semente();
        const p = proc({ passos: [passo({ id: "1", cargoId: "c-vendedor" }), passo({ id: "2", cargoId: "c-supervisor" })] });
        igual(bpmnDoProcesso(p).faixas.map((f) => f.nome), ["Vendedor", "Supervisor Operacional"]);
      });

      teste("passo sem título ainda aparece no desenho", () => {
        state = semente();
        const m = bpmnDoProcesso(proc({ passos: [passo({ oQue: "" })] }));
        if (m.elementos.length !== 3) throw new Error("a forma sumiu");
      });

      teste("nenhum elemento fica órfão de fluxo", () => {
        state = semente();
        const p = proc({ passos: [passo({ id: "1" }), passo({ id: "2", tipo: "decisao", seNao: "desvio" }), passo({ id: "3" })] });
        const m = bpmnDoProcesso(p);
        const semEntrada = m.elementos.filter((e) => e.tipo !== "inicio" && !m.fluxos.some((f) => f.para === e.id));
        const semSaida = m.elementos.filter((e) => e.tipo !== "fim" && !m.fluxos.some((f) => f.de === e.id));
        igual([semEntrada.length, semSaida.length], [0, 0]);
      });

      teste("macro mostra todas as raias, mesmo vazias", () => {
        state = semente();
        state.processos = [proc({ id: "a", setorId: "s-comercial" })];
        igual(bpmnDoMapa().faixas.length, 4, "setores da semente:");
      });

      grupo("BPMN · desenho");

      teste("desenha SVG com raias e formas", () => {
        state = semente();
        const html = bpmnDesenhar(bpmnDoProcesso(proc({ passos: [passo(), passo({ id: "2" })] })));
        if (!html.includes("<svg")) throw new Error("sem svg");
        if (!html.includes("bpmn-faixa")) throw new Error("sem raia");
      });

      teste("nenhuma coordenada sai NaN", () => {
        state = semente();
        const html = bpmnDesenhar(bpmnDoProcesso(proc({ passos: [passo({ tipo: "decisao", seNao: "x" }), passo({ id: "2" })] })));
        if (/NaN|undefined/.test(html)) throw new Error("coordenada quebrada");
      });

      teste("dois rótulos do mesmo gateway não se sobrepõem", () => {
        state = semente();
        const p = proc({ passos: [passo({ tipo: "decisao", seSim: "a", seNao: "b" }), passo({ id: "2" })] });
        const html = bpmnDesenhar(bpmnDoProcesso(p));
        const ys = [...html.matchAll(/class="bpmn-rotulo-fluxo"[^>]*y="([\d.]+)"/g)].map((m) => m[1]);
        const alt = [...html.matchAll(/<text x="[\d.]+" y="([\d.]+)" class="bpmn-rotulo-fluxo"/g)].map((m) => m[1]);
        const todos = ys.length ? ys : alt;
        if (todos.length >= 2 && new Set(todos).size !== todos.length) throw new Error("rótulos empilhados em " + todos);
      });

      grupo("BPMN · gateway inclusivo e fim nomeado");

      teste("decisão sem tipo assume exclusivo", () => {
        const d = normalizar({ empresa: {}, setores: [], cargos: [], fases: [], processos: [], documentos: [], sistemas: [],
          decisoes: [{ id: "d1", pergunta: "?" }, { id: "d2", pergunta: "?", tipo: "inventado" }] });
        igual(d.decisoes.map((x) => x.tipo), ["exclusivo", "exclusivo"]);
      });

      teste("exclusivo desenha X, inclusivo desenha círculo", () => {
        state = semente();
        state.processos = [proc({ id: "a", proximos: [{ para: "d1", rotulo: "" }] })];
        state.decisoes = [{ id: "d1", tipo: "inclusivo", pergunta: "Modalidade?", setorId: "s-comercial", faseId: "f-orcar", proximos: [] }];
        const m = bpmnDoMapa();
        igual(m.elementos.find((e) => e.id === "d1").simbolo, "O");
        state.decisoes[0].tipo = "exclusivo";
        igual(bpmnDoMapa().elementos.find((e) => e.id === "d1").simbolo, "X");
      });

      teste("fim nomeado entra no grafo com o nome dele", () => {
        state = semente();
        state.processos = [proc({ id: "a", proximos: [{ para: "f1", rotulo: "não" }] })];
        state.fins = [{ id: "f1", nome: "Proposta não aprovada", setorId: "s-comercial", faseId: "f-orcar", proximos: [] }];
        const m = bpmnDoMapa();
        const f = m.elementos.find((e) => e.id === "f1");
        igual([f.tipo, f.rotulo], ["fim", "Proposta não aprovada"]);
      });

      teste("quem termina em fim nomeado não ganha fim automático", () => {
        state = semente();
        state.processos = [proc({ id: "a", proximos: [{ para: "f1", rotulo: "" }] })];
        state.fins = [{ id: "f1", nome: "Concluído", setorId: "s-comercial", faseId: "f-orcar", proximos: [] }];
        const fins = bpmnDoMapa().elementos.filter((e) => e.tipo === "fim");
        igual(fins.length, 1, "deveria haver só o nomeado:");
      });

      teste("ligação para um fim apagado é descartada", () => {
        const d = normalizar({ empresa: {}, setores: [], cargos: [], fases: [], documentos: [], sistemas: [],
          decisoes: [], fins: [], processos: [proc({ proximos: [{ para: "f-sumiu", rotulo: "" }] })] });
        igual(d.processos[0].proximos, []);
      });

      teste("a alça de ligar aparece quando o desenho é ligável", () => {
        state = semente();
        state.processos = [proc({ id: "a" })];
        const comAlca = bpmnDesenhar(bpmnDoMapa(), { interativo: true, ligavel: true });
        const semAlca = bpmnDesenhar(bpmnDoMapa(), { interativo: true });
        if (!comAlca.includes("bpmn-alca")) throw new Error("sem alça quando deveria ter");
        if (semAlca.includes("bpmn-alca")) throw new Error("alça em desenho só de leitura");
      });

      teste("o fim não recebe alça de saída — dele não sai nada", () => {
        state = semente();
        state.fins = [{ id: "f1", nome: "Fim", setorId: "s-comercial", faseId: "f-orcar", proximos: [] }];
        state.processos = [proc({ id: "a", proximos: [{ para: "f1", rotulo: "" }] })];
        const html = bpmnDesenhar(bpmnDoMapa(), { interativo: true, ligavel: true });
        const alcas = [...html.matchAll(/data-bpmn-alca="([^"]+)"/g)].map((m) => m[1]);
        if (alcas.includes("f1")) throw new Error("o fim ganhou alça de saída");
      });

      // ============================================================ TELA

      grupo("Tela · o que o CSS pode esconder");

      teste("atributo hidden vence qualquer classe com display", () => {
        const d = document.createElement("div");
        d.className = "portao";
        d.hidden = true;
        document.getElementById("palco").appendChild(d);
        const visivel = getComputedStyle(d).display !== "none";
        d.remove();
        if (visivel) throw new Error("elemento continua na tela mesmo com hidden — foi este o bug do login");
      });

      teste("as classes que se escondem obedecem", () => {
        const quebradas = [];
        ["portao", "aviso-remoto", "drawer", "drawer-scrim", "presenca"].forEach((c) => {
          const d = document.createElement("div");
          d.className = c;
          d.hidden = true;
          document.getElementById("palco").appendChild(d);
          if (getComputedStyle(d).display !== "none") quebradas.push(c);
          d.remove();
        });
        if (quebradas.length) throw new Error("continuam visíveis: " + quebradas.join(", "));
      });

      // ============================================================ placar

      const placar = document.getElementById("placar");
      placar.innerHTML = falhou
        ? `<span class="vermelho">${falhou} falhou${falhou > 1 ? "ram" : ""}</span> · ${passou} passou${passou > 1 ? "ram" : ""}`
        : `<span class="verde">${passou} testes, todos passaram</span>`;
      document.title = `${falhou ? "✕" : "✔"} Testes do CIP`;
    </script>
